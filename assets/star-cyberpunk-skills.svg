      <stop offset="0%" stop-color="#7abfff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4a7ac0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sk-vdiv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#2a5090" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#3a6ab0" stop-opacity="0.4"/>
      <stop offset="70%"  stop-color="#3a6ab0" stop-opacity="0.4"/>
