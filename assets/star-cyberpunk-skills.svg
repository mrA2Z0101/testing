    </linearGradient>
    <pattern id="sk-scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="black" opacity="0.07"/>
    </pattern>
    <filter id="sk-sf" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sk-cglow" x="-80%" y="-400%" width="260%" height="900%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sk-hbloom" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes sk-tw  { 0%,100%{opacity:.06} 50%{opacity:.88} }
      @keyframes sk-tw2 { 0%,100%{opacity:.12} 58%{opacity:.72} }
      @keyframes sk-tw3 { 0%,100%{opacity:.02} 52%{opacity:.52} }
      @keyframes sk-tw4 { 0%,100%{opacity:.08} 45%{opacity:.55} }
      @keyframes sk-bd  { 0%,100%{opacity:.10} 50%{opacity:.28} }
      @keyframes sk-cm  {
        0%,8%{transform:translate(-200px,10px)} 22%{transform:translate(1060px,130px)}
        22.01%{transform:translate(-200px,10px)} 100%{transform:translate(-200px,10px)}
      }
      @keyframes sk-cf  { 0%,8%{opacity:0} 9.5%{opacity:1} 20%{opacity:1} 22%{opacity:0} 100%{opacity:0} }
      @keyframes sk-grow { from{width:0} }
      .sk-s1{animation:sk-tw  5.5s ease-in-out infinite}
      .sk-s2{animation:sk-tw2 7.8s ease-in-out infinite}
      .sk-s3{animation:sk-tw3 11s  ease-in-out infinite}
      .sk-s4{animation:sk-tw4 14s  ease-in-out infinite}
      .sk-bd{animation:sk-bd  16s  ease-in-out infinite}
      .sk-cm{animation:sk-cm  26s linear infinite,sk-cf 26s linear infinite;transform-origin:0 0}
      .sk-bar{animation:sk-grow 1.4s cubic-bezier(.2,.8,.2,1) both}
    </style>
