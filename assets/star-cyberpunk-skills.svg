      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="sk-bar-a" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6aaaff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3a6ab0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sk-bar-b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a9aef" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2a5a9a" stop-opacity="0.6"/>
    </linearGradient>
